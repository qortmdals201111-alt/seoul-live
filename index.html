<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>SEOUL LIVE</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    body {
      position: fixed;
      inset: 0;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* =========================================================
       VIDEO
    ========================================================= */

    #videoContainer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .video-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center center;

      opacity: 0;

      transition:
        opacity 3.5s ease-in-out,
        filter 2s ease-in-out;

      background: #000;

      pointer-events: none;
    }

    .video-layer.active {
      opacity: 1;
    }

    .video-layer.loading {
      opacity: 0;
    }

    /* =========================================================
       WEATHER CANVAS
    ========================================================= */

    #weatherCanvas {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;
      z-index: 10;
    }

    #fogLayer {
      position: absolute;
      inset: -10%;

      pointer-events: none;
      z-index: 11;

      opacity: 0;

      background:
        radial-gradient(
          ellipse at center,
          rgba(255,255,255,0.18) 0%,
          rgba(255,255,255,0.08) 35%,
          rgba(255,255,255,0.02) 60%,
          transparent 80%
        );

      filter: blur(18px);

      transition: opacity 2s ease;
    }

    #fogLayer.active {
      opacity: 1;
    }

    #lightning {
      position: absolute;
      inset: 0;

      background: rgba(255,255,255,0);

      pointer-events: none;

      z-index: 12;

      transition: background 0.05s linear;
    }

    #darkOverlay {
      position: absolute;
      inset: 0;

      pointer-events: none;

      z-index: 13;

      background: rgba(0,0,0,0);

      transition:
        background 2s ease,
        opacity 2s ease;
    }

    #vignette {
      position: absolute;
      inset: 0;

      pointer-events: none;

      z-index: 14;

      background:
        radial-gradient(
          ellipse at center,
          transparent 45%,
          rgba(0,0,0,0.10) 75%,
          rgba(0,0,0,0.28) 100%
        );
    }

    /* =========================================================
       UI
    ========================================================= */

    #ui {
      position: absolute;
      inset: 0;

      z-index: 30;

      pointer-events: none;

      color: #fff;

      text-shadow:
        0 1px 4px rgba(0,0,0,0.8),
        0 2px 12px rgba(0,0,0,0.5);
    }

    #topInfo {
      position: absolute;

      top: max(24px, env(safe-area-inset-top));
      left: 28px;

      display: flex;
      flex-direction: column;

      gap: 3px;
    }

    #brand {
      font-size: 14px;
      font-weight: 700;

      letter-spacing: 3px;

      opacity: 0.92;
    }

    #location {
      font-size: 9px;
      letter-spacing: 1.5px;

      opacity: 0.65;
    }

    #clockBox {
      position: absolute;

      top: max(24px, env(safe-area-inset-top));
      right: 28px;

      text-align: right;
    }

    #clock {
      font-size: clamp(22px, 3vw, 34px);

      font-weight: 600;

      letter-spacing: 1px;

      line-height: 1;
    }

    #date {
      margin-top: 6px;

      font-size: 9px;

      letter-spacing: 1px;

      opacity: 0.72;
    }

    #weatherBox {
      position: absolute;

      left: 28px;
      bottom: max(30px, env(safe-area-inset-bottom));

      display: flex;
      flex-direction: column;

      gap: 3px;
    }

    #weatherMain {
      display: flex;

      align-items: center;

      gap: 8px;
    }

    #weatherIcon {
      font-size: 28px;

      line-height: 1;
    }

    #temperature {
      font-size: 17px;

      font-weight: 600;
    }

    #weatherDescription {
      font-size: 10px;

      letter-spacing: 0.4px;

      opacity: 0.85;
    }

    #sunInfo {
      margin-top: 5px;

      font-size: 8px;

      letter-spacing: 0.4px;

      opacity: 0.65;
    }

    #status {
      position: absolute;

      right: 28px;
      bottom: max(30px, env(safe-area-inset-bottom));

      font-size: 8px;

      letter-spacing: 1px;

      opacity: 0.55;

      text-align: right;
    }

    /* =========================================================
       TEST MODE
    ========================================================= */

    #testMode {
      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      padding: 12px 18px;

      border-radius: 8px;

      background: rgba(0,0,0,0.55);

      border: 1px solid rgba(255,255,255,0.2);

      backdrop-filter: blur(10px);

      font-size: 12px;

      letter-spacing: 1px;

      opacity: 0;

      transition: opacity 0.3s ease;
    }

    #testMode.visible {
      opacity: 1;
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 700px) {
      #topInfo {
        left: 18px;
      }

      #clockBox {
        right: 18px;
      }

      #weatherBox {
        left: 18px;
        bottom: max(22px, env(safe-area-inset-bottom));
      }

      #status {
        right: 18px;
        bottom: max(22px, env(safe-area-inset-bottom));
      }

      #brand {
        font-size: 12px;
        letter-spacing: 2.5px;
      }

      #location {
        font-size: 8px;
      }

      #clock {
        font-size: 24px;
      }

      #date {
        font-size: 8px;
      }

      #weatherIcon {
        font-size: 24px;
      }

      #temperature {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

<div id="app">

  <!-- =======================================================
       VIDEO CONTAINER
  ======================================================== -->

  <div id="videoContainer">

    <video
      id="videoMorning"
      class="video-layer"
      muted
      autoplay
      loop
      playsinline
      webkit-playsinline
      preload="auto"
    ></video>

    <video
      id="videoDay"
      class="video-layer"
      muted
      autoplay
      loop
      playsinline
      webkit-playsinline
      preload="auto"
    ></video>

    <video
      id="videoEvening"
      class="video-layer"
      muted
      autoplay
      loop
      playsinline
      webkit-playsinline
      preload="auto"
    ></video>

    <video
      id="videoNight"
      class="video-layer"
      muted
      autoplay
      loop
      playsinline
      webkit-playsinline
      preload="auto"
    ></video>

  </div>

  <!-- WEATHER -->

  <canvas id="weatherCanvas"></canvas>

  <div id="fogLayer"></div>

  <div id="lightning"></div>

  <div id="darkOverlay"></div>

  <div id="vignette"></div>

  <!-- UI -->

  <div id="ui">

    <div id="topInfo">
      <div id="brand">SEOUL LIVE</div>
      <div id="location">SEOUL · KOREA</div>
    </div>

    <div id="clockBox">
      <div id="clock">--:--:--</div>
      <div id="date">----</div>
    </div>

    <div id="weatherBox">

      <div id="weatherMain">

        <div id="weatherIcon">🌤️</div>

        <div id="temperature">
          --°
        </div>

      </div>

      <div id="weatherDescription">
        서울 날씨 불러오는 중
      </div>

      <div id="sunInfo">
        일출 --:-- · 일몰 --:--
      </div>

    </div>

    <div id="status">
      LIVE · SEOUL
    </div>

    <div id="testMode">
      WEATHER TEST
    </div>

  </div>

</div>

<script>
/* ============================================================
   SEOUL LIVE
   ============================================================

   영상 구조:

   assets/
     morning.mp4 또는 morning.mov
     day.mov 또는 day.mp4
     evening.mp4 또는 evening.mov
     night.mp4 또는 night.mov

   실제 파일 확장자가 달라도 자동으로 찾아서 사용한다.

   ============================================================ */


/* ============================================================
   1. VIDEO FILES
   ============================================================ */

const VIDEO_FILES = {

  morning: [
    "assets/morning.mp4",
    "assets/morning.mov"
  ],

  day: [
    "assets/day.mov",
    "assets/day.mp4"
  ],

  evening: [
    "assets/evening.mp4",
    "assets/evening.mov"
  ],

  night: [
    "assets/night.mp4",
    "assets/night.mov"
  ]

};


/* ============================================================
   2. VIDEO ELEMENTS
   ============================================================ */

const videos = {

  morning: document.getElementById("videoMorning"),
  day: document.getElementById("videoDay"),
  evening: document.getElementById("videoEvening"),
  night: document.getElementById("videoNight")

};


/* ============================================================
   3. VIDEO SOURCE LOADER
   ============================================================ */

const videoSourceIndex = {
  morning: 0,
  day: 0,
  evening: 0,
  night: 0
};


function loadVideoSource(period, index = 0) {

  const video = videos[period];

  if (!video) {
    return;
  }

  const sources = VIDEO_FILES[period];

  if (!sources || !sources.length) {
    return;
  }

  if (index >= sources.length) {

    console.error(
      "영상 파일을 찾을 수 없습니다:",
      period,
      sources
    );

    return;
  }

  videoSourceIndex[period] = index;

  video.src = sources[index];

  video.load();

}


/* ============================================================
   4. VIDEO ERROR FALLBACK
   ============================================================ */

Object.keys(videos).forEach((period) => {

  const video = videos[period];

  video.addEventListener("error", () => {

    const currentIndex =
      videoSourceIndex[period];

    const nextIndex =
      currentIndex + 1;

    if (
      VIDEO_FILES[period] &&
      nextIndex < VIDEO_FILES[period].length
    ) {

      console.log(
        "영상 형식 변경 시도:",
        period,
        VIDEO_FILES[period][nextIndex]
      );

      loadVideoSource(period, nextIndex);

    } else {

      console.error(
        "재생 가능한 영상이 없습니다:",
        period
      );

    }

  });

});


/* ============================================================
   5. INITIAL VIDEO LOAD
   ============================================================ */

loadVideoSource("morning");
loadVideoSource("day");
loadVideoSource("evening");
loadVideoSource("night");


/* ============================================================
   6. SEOUL TIME
   ============================================================ */

function getSeoulNow() {

  const now = new Date();

  const formatter =
    new Intl.DateTimeFormat(
      "en-US",
      {
        timeZone: "Asia/Seoul",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hourCycle: "h23"
      }
    );

  const parts =
    formatter.formatToParts(now);

  const values = {};

  parts.forEach((part) => {

    if (part.type !== "literal") {
      values[part.type] = part.value;
    }

  });

  return {

    year: Number(values.year),
    month: Number(values.month),
    day: Number(values.day),

    hour: Number(values.hour),
    minute: Number(values.minute),
    second: Number(values.second)

  };

}


/* ============================================================
   7. CLOCK
   ============================================================ */

function updateClock() {

  const now = getSeoulNow();

  const clock =
    document.getElementById("clock");

  const date =
    document.getElementById("date");

  const hh =
    String(now.hour).padStart(2, "0");

  const mm =
    String(now.minute).padStart(2, "0");

  const ss =
    String(now.second).padStart(2, "0");

  clock.textContent =
    `${hh}:${mm}:${ss}`;

  date.textContent =
    `${now.year}.${String(now.month).padStart(2, "0")}.${String(now.day).padStart(2, "0")}`;

}


updateClock();

setInterval(updateClock, 1000);


/* ============================================================
   8. TIME CONVERSION
   ============================================================ */

function parseTimeToMinutes(timeString) {

  if (!timeString) {
    return null;
  }

  const parts =
    timeString.split(":");

  if (parts.length < 2) {
    return null;
  }

  return (
    Number(parts[0]) * 60 +
    Number(parts[1])
  );

}


/* ============================================================
   9. SUN TIMES
   ============================================================ */

let sunriseMinutes = 360;
let sunsetMinutes = 1110;


/* ============================================================
   10. PERIOD SETTINGS
   ============================================================ */

const MORNING_BEFORE_SUNRISE = 60;
const MORNING_AFTER_SUNRISE = 120;

const EVENING_BEFORE_SUNSET = 90;
const EVENING_AFTER_SUNSET = 90;


/* ============================================================
   11. GET CURRENT MINUTES
   ============================================================ */

function getCurrentMinutes() {

  const now = getSeoulNow();

  return (
    now.hour * 60 +
    now.minute
  );

}


/* ============================================================
   12. GET VIDEO PERIOD
   ============================================================ */

function getVideoPeriod() {

  const current =
    getCurrentMinutes();

  const morningStart =
    sunriseMinutes -
    MORNING_BEFORE_SUNRISE;

  const morningEnd =
    sunriseMinutes +
    MORNING_AFTER_SUNRISE;

  const eveningStart =
    sunsetMinutes -
    EVENING_BEFORE_SUNSET;

  const eveningEnd =
    sunsetMinutes +
    EVENING_AFTER_SUNSET;


  if (
    current >= morningStart &&
    current < morningEnd
  ) {

    return "morning";

  }


  if (
    current >= morningEnd &&
    current < eveningStart
  ) {

    return "day";

  }


  if (
    current >= eveningStart &&
    current < eveningEnd
  ) {

    return "evening";

  }


  return "night";

}


/* ============================================================
   13. CURRENT PERIOD
   ============================================================ */

let currentPeriod = null;


/* ============================================================
   14. VIDEO PLAY
   ============================================================ */

async function safePlay(video) {

  if (!video) {
    return;
  }

  try {

    video.muted = true;

    await video.play();

  } catch (error) {

    console.log(
      "자동재생 대기:",
      error
    );

  }

}


/* ============================================================
   15. SWITCH VIDEO
   ============================================================ */

function switchVideo(period, force = false) {

  if (
    currentPeriod === period &&
    !force
  ) {
    return;
  }


  const newVideo =
    videos[period];

  if (!newVideo) {
    return;
  }


  const previousPeriod =
    currentPeriod;

  const previousVideo =
    previousPeriod
      ? videos[previousPeriod]
      : null;


  currentPeriod = period;


  /*
   * 새 영상은 처음부터 시작
   */

  try {

    newVideo.currentTime = 0;

  } catch (error) {

  }


  /*
   * 새 영상 활성화
   */

  newVideo.classList.add("active");


  /*
   * 새 영상 재생
   */

  safePlay(newVideo);


  /*
   * 기존 영상은 천천히 사라짐
   */

  if (
    previousVideo &&
    previousVideo !== newVideo
  ) {

    previousVideo.classList.remove("active");

    setTimeout(() => {

      try {

        previousVideo.pause();

      } catch (error) {

      }

    }, 4000);

  }


  /*
   * 상태
   */

  const status =
    document.getElementById("status");

  status.textContent =
    `LIVE · SEOUL · ${period.toUpperCase()}`;

}


/* ============================================================
   16. INITIAL PERIOD
   ============================================================ */

function initializeVideoPeriod() {

  const period =
    getVideoPeriod();

  switchVideo(
    period,
    true
  );

}


setTimeout(() => {

  initializeVideoPeriod();

}, 300);


/* ============================================================
   17. PERIOD CHECK
   ============================================================ */

setInterval(() => {

  const period =
    getVideoPeriod();

  if (
    period !== currentPeriod
  ) {

    switchVideo(period);

  }

}, 60 * 1000);


/* ============================================================
   18. VIDEO LOOP SAFETY
   ============================================================ */

Object.keys(videos).forEach((period) => {

  const video =
    videos[period];

  video.loop = true;

  video.muted = true;

  video.playsInline = true;

  video.addEventListener(
    "ended",
    () => {

      /*
       * 혹시 브라우저가 loop를
       * 제대로 처리하지 못하는 경우
       */

      if (
        period === currentPeriod
      ) {

        try {

          video.currentTime = 0;

          safePlay(video);

        } catch (error) {

        }

      }

    }
  );

});


/* ============================================================
   19. PAGE VISIBILITY
   ============================================================ */

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      !document.hidden &&
      currentPeriod
    ) {

      safePlay(
        videos[currentPeriod]
      );

    }

  }
);


/* ============================================================
   20. WINDOW FOCUS
   ============================================================ */

window.addEventListener(
  "focus",
  () => {

    if (currentPeriod) {

      safePlay(
        videos[currentPeriod]
      );

    }

  }
);


/* ============================================================
   21. WEATHER
   ============================================================ */

const WEATHER_URL =
  "https://api.open-meteo.com/v1/forecast" +
  "?latitude=37.5665" +
  "&longitude=126.9780" +
  "&current=" +
  "temperature_2m," +
  "relative_humidity_2m," +
  "apparent_temperature," +
  "precipitation," +
  "rain," +
  "showers," +
  "snowfall," +
  "weather_code," +
  "cloud_cover," +
  "wind_speed_10m," +
  "wind_direction_10m," +
  "wind_gusts_10m," +
  "is_day" +
  "&daily=sunrise,sunset" +
  "&timezone=Asia%2FSeoul";


let currentWeatherType =
  "clear";


/* ============================================================
   22. WEATHER CODE
   ============================================================ */

function getWeatherType(code) {

  if (code === 0) {
    return "clear";
  }

  if (
    code >= 1 &&
    code <= 3
  ) {
    return "cloudy";
  }

  if (
    code === 45 ||
    code === 48
  ) {
    return "fog";
  }

  if (
    code >= 51 &&
    code <= 67
  ) {
    return "rain";
  }

  if (
    code >= 71 &&
    code <= 77
  ) {
    return "snow";
  }

  if (
    code >= 80 &&
    code <= 82
  ) {
    return "rain";
  }

  if (
    code === 85 ||
    code === 86
  ) {
    return "snow";
  }

  if (
    code === 95 ||
    code === 96 ||
    code === 99
  ) {
    return "storm";
  }

  return "clear";

}


/* ============================================================
   23. WEATHER TEXT
   ============================================================ */

function getWeatherDescription(
  code
) {

  if (code === 0) {
    return "맑음";
  }

  if (code === 1) {
    return "대체로 맑음";
  }

  if (code === 2) {
    return "부분적으로 흐림";
  }

  if (code === 3) {
    return "흐림";
  }

  if (
    code === 45 ||
    code === 48
  ) {
    return "안개";
  }

  if (
    code >= 51 &&
    code <= 57
  ) {
    return "이슬비";
  }

  if (
    code >= 61 &&
    code <= 67
  ) {
    return "비";
  }

  if (
    code >= 71 &&
    code <= 77
  ) {
    return "눈";
  }

  if (
    code >= 80 &&
    code <= 82
  ) {
    return "소나기";
  }

  if (
    code === 85 ||
    code === 86
  ) {
    return "눈 소나기";
  }

  if (
    code === 95 ||
    code === 96 ||
    code === 99
  ) {
    return "뇌우";
  }

  return "맑음";

}


/* ============================================================
   24. WEATHER ICON
   ============================================================ */

function getWeatherIcon(
  code
) {

  if (code === 0) {
    return "☀️";
  }

  if (
    code === 1 ||
    code === 2
  ) {
    return "🌤️";
  }

  if (code === 3) {
    return "☁️";
  }

  if (
    code === 45 ||
    code === 48
  ) {
    return "🌫️";
  }

  if (
    code >= 51 &&
    code <= 67
  ) {
    return "🌧️";
  }

  if (
    code >= 71 &&
    code <= 77
  ) {
    return "❄️";
  }

  if (
    code >= 80 &&
    code <= 82
  ) {
    return "🌦️";
  }

  if (
    code === 85 ||
    code === 86
  ) {
    return "🌨️";
  }

  if (
    code === 95 ||
    code === 96 ||
    code === 99
  ) {
    return "⛈️";
  }

  return "🌤️";

}


/* ============================================================
   25. WEATHER EFFECT ENGINE
   ============================================================ */

const canvas =
  document.getElementById(
    "weatherCanvas"
  );

const ctx =
  canvas.getContext("2d");


let particles = [];

let animationFrame = null;

let lightningTimer = null;


function resizeCanvas() {

  const dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  canvas.width =
    window.innerWidth * dpr;

  canvas.height =
    window.innerHeight * dpr;

  canvas.style.width =
    window.innerWidth + "px";

  canvas.style.height =
    window.innerHeight + "px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

}


resizeCanvas();

window.addEventListener(
  "resize",
  resizeCanvas
);


/* ============================================================
   26. PARTICLE CREATION
   ============================================================ */

function createRainParticle() {

  return {

    x:
      Math.random() *
      window.innerWidth,

    y:
      Math.random() *
      window.innerHeight,

    speed:
      12 +
      Math.random() * 15,

    length:
      10 +
      Math.random() * 18,

    opacity:
      0.15 +
      Math.random() * 0.35

  };

}


function createSnowParticle() {

  return {

    x:
      Math.random() *
      window.innerWidth,

    y:
      Math.random() *
      window.innerHeight,

    speed:
      0.7 +
      Math.random() * 2,

    size:
      1 +
      Math.random() * 3,

    drift:
      Math.random() * 1.2 - 0.6,

    opacity:
      0.35 +
      Math.random() * 0.5

  };

}


/* ============================================================
   27. PARTICLES
   ============================================================ */

function setupParticles(
  type
) {

  particles = [];

  if (
    type === "rain" ||
    type === "storm"
  ) {

    const count =
      Math.min(
        260,
        Math.floor(
          window.innerWidth / 4
        )
      );

    for (
      let i = 0;
      i < count;
      i++
    ) {

      particles.push(
        createRainParticle()
      );

    }

  }


  if (type === "snow") {

    const count =
      Math.min(
        180,
        Math.floor(
          window.innerWidth / 6
        )
      );

    for (
      let i = 0;
      i < count;
      i++
    ) {

      particles.push(
        createSnowParticle()
      );

    }

  }

}


/* ============================================================
   28. WEATHER ANIMATION
============================================================ */

function animateWeather() {

  ctx.clearRect(
    0,
    0,
    window.innerWidth,
    window.innerHeight
  );


  if (
    currentWeatherType === "rain" ||
    currentWeatherType === "storm"
  ) {

    ctx.lineWidth = 1;

    particles.forEach(
      (particle) => {

        ctx.beginPath();

        ctx.moveTo(
          particle.x,
          particle.y
        );

        ctx.lineTo(
          particle.x - 2,
          particle.y +
            particle.length
        );

        ctx.strokeStyle =
          `rgba(190,210,255,${particle.opacity})`;

        ctx.stroke();


        particle.y +=
          particle.speed;

        particle.x -= 0.5;


        if (
          particle.y >
          window.innerHeight + 30
        ) {

          particle.y = -30;

          particle.x =
            Math.random() *
            window.innerWidth;

        }

      }
    );

  }


  if (
    currentWeatherType === "snow"
  ) {

    particles.forEach(
      (particle) => {

        ctx.beginPath();

        ctx.arc(
          particle.x,
          particle.y,
          particle.size,
          0,
          Math.PI * 2
        );

        ctx.fillStyle =
          `rgba(255,255,255,${particle.opacity})`;

        ctx.fill();


        particle.y +=
          particle.speed;

        particle.x +=
          particle.drift;


        if (
          particle.y >
          window.innerHeight + 10
        ) {

          particle.y = -10;

          particle.x =
            Math.random() *
            window.innerWidth;

        }


        if (
          particle.x >
          window.innerWidth + 10
        ) {

          particle.x = -10;

        }


        if (
          particle.x < -10
        ) {

          particle.x =
            window.innerWidth + 10;

        }

      }
    );

  }


  animationFrame =
    requestAnimationFrame(
      animateWeather
    );

}


animateWeather();


/* ============================================================
   29. LIGHTNING
   ============================================================ */

function triggerLightning() {

  const lightning =
    document.getElementById(
      "lightning"
    );

  lightning.style.background =
    "rgba(255,255,255,0.38)";


  setTimeout(() => {

    lightning.style.background =
      "rgba(255,255,255,0)";

  }, 70);


  setTimeout(() => {

    lightning.style.background =
      "rgba(255,255,255,0.16)";

  }, 130);


  setTimeout(() => {

    lightning.style.background =
      "rgba(255,255,255,0)";

  }, 190);

}


function startLightning() {

  stopLightning();

  function schedule() {

    const delay =
      4000 +
      Math.random() * 10000;

    lightningTimer =
      setTimeout(() => {

        if (
          currentWeatherType ===
          "storm"
        ) {

          triggerLightning();

        }

        schedule();

      }, delay);

  }

  schedule();

}


function stopLightning() {

  if (lightningTimer) {

    clearTimeout(
      lightningTimer
    );

    lightningTimer = null;

  }

}


/* ============================================================
   30. APPLY WEATHER
   ============================================================ */

function applyWeatherEffect(
  type
) {

  currentWeatherType =
    type;


  setupParticles(type);


  const fog =
    document.getElementById(
      "fogLayer"
    );

  const dark =
    document.getElementById(
      "darkOverlay"
    );


  /*
   * 안개
   */

  if (type === "fog") {

    fog.classList.add(
      "active"
    );

  } else {

    fog.classList.remove(
      "active"
    );

  }


  /*
   * 폭풍
   */

  if (type === "storm") {

    dark.style.background =
      "rgba(15,20,35,0.12)";

    startLightning();

  } else {

    dark.style.background =
      "rgba(0,0,0,0)";

    stopLightning();

  }

}


/* ============================================================
   31. WEATHER FETCH
   ============================================================ */

async function fetchWeather() {

  try {

    const response =
      await fetch(
        WEATHER_URL,
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        `Weather HTTP ${response.status}`
      );

    }


    const data =
      await response.json();


    if (
      data.current
    ) {

      const current =
        data.current;


      const temperature =
        document.getElementById(
          "temperature"
        );

      const weatherDescription =
        document.getElementById(
          "weatherDescription"
        );

      const weatherIcon =
        document.getElementById(
          "weatherIcon"
        );


      const code =
        Number(
          current.weather_code
        );


      const type =
        getWeatherType(code);


      temperature.textContent =
        `${Math.round(
          current.temperature_2m
        )}°`;


      weatherDescription.textContent =
        getWeatherDescription(
          code
        );


      weatherIcon.textContent =
        getWeatherIcon(
          code
        );


      applyWeatherEffect(
        type
      );

    }


    /*
     * 일출 / 일몰
     */

    if (
      data.daily &&
      data.daily.sunrise &&
      data.daily.sunset
    ) {

      const sunrise =
        data.daily.sunrise[0];

      const sunset =
        data.daily.sunset[0];


      sunriseMinutes =
        parseTimeToMinutes(
          sunrise.split("T")[1]
        );


      sunsetMinutes =
        parseTimeToMinutes(
          sunset.split("T")[1]
        );


      const sunInfo =
        document.getElementById(
          "sunInfo"
        );


      sunInfo.textContent =
        `일출 ${sunrise.split("T")[1]} · 일몰 ${sunset.split("T")[1]}`;


      /*
       * 일출/일몰 정보가 새로 들어왔으므로
       * 현재 영상 구간도 다시 확인
       */

      const period =
        getVideoPeriod();


      if (
        period !== currentPeriod
      ) {

        switchVideo(
          period
        );

      }

    }


  } catch (error) {

    console.error(
      "날씨 정보를 가져오지 못했습니다:",
      error
    );

    document
      .getElementById(
        "weatherDescription"
      )
      .textContent =
      "날씨 정보 연결 중";


  }

}

/* ============================================================
   34. WEATHER TEST MODE
   ============================================================ */

const weatherTestModes = [
  "clear",
  "cloudy",
  "rain",
  "snow",
  "fog",
  "storm"
];


let testModeIndex = -1;

const testModeElement =
  document.getElementById(
    "testMode"
  );


function updateTestModeLabel() {

  if (
    testModeIndex < 0
  ) {

    testModeElement.classList.remove(
      "visible"
    );

    return;

  }


  const type =
    weatherTestModes[
      testModeIndex
    ];


  testModeElement.textContent =
    `WEATHER TEST · ${type.toUpperCase()}`;


  testModeElement.classList.add(
    "visible"
  );

}


document.addEventListener(
  "keydown",
  (event) => {

    /*
     * R = 날씨 테스트
     */

    if (
      event.key.toLowerCase() === "r"
    ) {

      testModeIndex =
        (
          testModeIndex + 1
        ) %
        weatherTestModes.length;


      applyWeatherEffect(
        weatherTestModes[
          testModeIndex
        ]
      );


      updateTestModeLabel();

    }


    /*
     * ESC = 실제 날씨로 복귀
     */

    if (
      event.key === "Escape"
    ) {

      testModeIndex = -1;

      updateTestModeLabel();

      fetchWeather();

    }

  }
);
