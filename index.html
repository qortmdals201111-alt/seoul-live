<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEOUL LIVE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #backgroundVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    .shade {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,.22),
        transparent 25%,
        transparent 70%,
        rgba(0,0,0,.28)
      );
    }

    #topInfo, #clockBox, #weatherBox, #status {
      position: absolute;
      z-index: 2;
      color: white;
      text-shadow: 0 2px 10px rgba(0,0,0,.8);
    }

    #topInfo {
      top: 28px;
      left: 32px;
    }

    #brand {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    #location {
      margin-top: 5px;
      font-size: 12px;
      letter-spacing: 1px;
      opacity: .8;
    }

    #clockBox {
      top: 28px;
      right: 32px;
      text-align: right;
    }

    #clock {
      font-size: 30px;
      font-weight: 600;
      letter-spacing: 2px;
    }

    #date {
      margin-top: 5px;
      font-size: 12px;
      opacity: .8;
    }

    #weatherBox {
      left: 32px;
      bottom: 28px;
    }

    #weatherMain {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #weatherIcon, #temperature {
      font-size: 28px;
      font-weight: 600;
    }

    #weatherDescription {
      margin-top: 5px;
      font-size: 13px;
    }

    #sunInfo {
      margin-top: 5px;
      font-size: 11px;
      opacity: .8;
    }

    #status {
      right: 32px;
      bottom: 28px;
      font-size: 11px;
      opacity: .8;
    }

    @media (max-width: 700px) {
      #topInfo { top: 18px; left: 18px; }
      #clockBox { top: 18px; right: 18px; }
      #weatherBox { left: 18px; bottom: 18px; }
      #status { right: 18px; bottom: 18px; }
      #brand { font-size: 17px; }
      #clock { font-size: 22px; }
      #weatherIcon, #temperature { font-size: 23px; }
    }
  </style>
</head>

<body>
  <main id="app">
    <video
      id="backgroundVideo"
      src="./assets/morning_clear.mp4"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
    ></video>

    <div class="shade"></div>

    <div id="topInfo">
      <div id="brand">SEOUL LIVE</div>
      <div id="location">SEOUL · KOREA</div>
    </div>

    <div id="clockBox">
      <div id="clock">00:00:00</div>
      <div id="date">0000.00.00</div>
    </div>

    <div id="weatherBox">
      <div id="weatherMain">
        <div id="weatherIcon">☀️</div>
        <div id="temperature">--°</div>
      </div>
      <div id="weatherDescription">서울 날씨 불러오는 중...</div>
      <div id="sunInfo">일출 --:-- · 일몰 --:--</div>
    </div>

    <div id="status">LIVE · SEOUL</div>
  </main>

  <script>
    const video = document.getElementById("backgroundVideo");

    // 영상 로딩 및 자동 재생
    video.addEventListener("error", () => {
      console.error(
        "배경 영상을 불러오지 못했습니다:",
        video.currentSrc,
        video.error
      );
    });

    video.play().catch(error => {
      console.warn("자동 재생을 시작하지 못했습니다.", error);
    });

    // 한국 시간 시계
    function updateClock() {
      const now = new Date();

      const parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Seoul",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hourCycle: "h23"
      }).formatToParts(now);

      const values = {};
      parts.forEach(part => {
        values[part.type] = part.value;
      });

      document.getElementById("clock").textContent =
        ${values.hour}:${values.minute}:${values.second};

      document.getElementById("date").textContent =
        ${values.year}.${values.month}.${values.day};
    }

    updateClock();
    setInterval(updateClock, 1000);

    // 서울 실시간 날씨 및 일출·일몰
    async function updateWeather() {
      const url =
        "https://api.open-meteo.com/v1/forecast" +
        "?latitude=37.5665&longitude=126.9780" +
        "&current=temperature_2m,relative_humidity_2m," +
        "apparent_temperature,is_day,precipitation,weather_code" +
        "&daily=sunrise,sunset&timezone=Asia%2FSeoul";

      try {
        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(날씨 API 오류: ${response.status});
        }

        const data = await response.json();
        const current = data.current;
        const code = current.weather_code;

        const weatherMap = [
          [0, 0, "맑음", "☀️"],
          [1, 1, "대체로 맑음", "🌤️"],
          [2, 2, "구름 조금", "⛅"],
          [3, 3, "흐림", "☁️"],
          [45, 48, "안개", "🌫️"],
          [51, 67, "비", "🌧️"],
          [71, 77, "눈", "❄️"],
          [80, 82, "소나기", "🌦️"],
          [85, 86, "눈 소나기", "🌨️"],
          [95, 99, "뇌우", "⛈️"]
        ];

        const matched = weatherMap.find(
          item => code >= item[0] && code <= item[1]
        );

        const description = matched ? matched[2] : "날씨 정보";
        const icon = matched ? matched[3] : "🌡️";

        document.getElementById("temperature").textContent =
          ${Math.round(current.temperature_2m)}°;

        document.getElementById("weatherIcon").textContent = icon;
        document.getElementById("weatherDescription").textContent =
          ${description} · 습도 ${current.relative_humidity_2m}%;

        function formatTime(value) {
          return new Intl.DateTimeFormat("ko-KR", {
            timeZone: "Asia/Seoul",
            hour: "2-digit",
            minute: "2-digit",
            hourCycle: "h23"
          }).format(new Date(value));
        }

        document.getElementById("sunInfo").textContent =
          일출 ${formatTime(data.daily.sunrise[0])} +
           · 일몰 ${formatTime(data.daily.sunset[0])};

        document.getElementById("status").textContent =
          LIVE · SEOUL · ${description};
      } catch (error) {
        console.error("날씨 정보를 불러오지 못했습니다.", error);
        document.getElementById("weatherDescription").textContent =
          "날씨 정보를 불러오지 못했습니다.";
      }
    }

    updateWeather();
    setInterval(updateWeather, 10 * 60 * 1000);
  </script>
</body>
</html>
